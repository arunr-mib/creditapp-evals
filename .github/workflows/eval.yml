name: eval

on:
  push:
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Unit test the grader
        run: npm test
      - name: Run the eval suite (recorded-trace mode, free — never --live in CI)
        run: npm run eval
